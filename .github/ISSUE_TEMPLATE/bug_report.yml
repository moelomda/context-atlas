name: Bug report
description: Report reproducible incorrect behavior in Context Atlas
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Context Atlas. Search existing issues first.
        **Do not report vulnerabilities, real secrets, proprietary source, or harassment here.** Follow SECURITY.md for a private report.

  - type: checkboxes
    id: safety
    attributes:
      label: Public-report safety
      options:
        - label: This report contains no vulnerability details, credentials, private source code, personal data, or real `.context-atlas` state.
          required: true

  - type: dropdown
    id: install
    attributes:
      label: Installation
      description: How are you running Context Atlas?
      options:
        - Source checkout
        - GitHub release archive
        - Codex plugin bundle
        - Other local installation
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Context Atlas version
      description: Use the package version or commit SHA; do not write only "latest".
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include operating system, architecture, Node.js version, and Git version.
      placeholder: Windows 11 x64; Node 24.x; Git 2.x
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - CLI
        - Dashboard
        - MCP server
        - Codex plugin
        - Ingestion or synchronization
        - Context pack
        - Database, ledger, backup, or restore
        - Packaging or documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: State the observed behavior and why it is incorrect.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use a disposable repository with synthetic content and list exact commands.
      placeholder: |
        1. Create a temporary Git repository containing ...
        2. Run `...`
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Paste only the smallest useful output. Redact local usernames, paths, tokens, source text, and personal data.
      render: shell

  - type: textarea
    id: regression
    attributes:
      label: Regression information
      description: Did this work in an earlier version? If so, identify the last known good version.

  - type: checkboxes
    id: checks
    attributes:
      label: Final checks
      options:
        - label: I searched open and closed issues for this problem.
          required: true
        - label: I can reproduce this with synthetic or public data.
          required: true
        - label: I understand that passing current alpha tests does not imply production-scale support.
          required: true
