name: Benchmark smoke

on:
  push:
    branches: [main]
    paths:
      - "scripts/benchmark/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/benchmark.yml"
  pull_request:
    paths:
      - "scripts/benchmark/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Deterministic smoke benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up exact minimum Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.12.0"
          cache: npm

      - name: Install declared npm toolchain
        run: npm install --global npm@11.9.0 --ignore-scripts

      - name: Install locked dependencies
        run: npm ci

      - name: Build distributable files
        run: npm run build

      - name: Generate deterministic smoke fixture
        run: npm run benchmark:generate -- --scenario smoke --clean

      - name: Run and validate smoke benchmark
        env:
          BENCHMARK_REPORT: ${{ runner.temp }}/context-atlas-benchmark-smoke.json
        run: |
          npm run benchmark -- --scenario smoke --samples 2 --output "$BENCHMARK_REPORT"
          npm run benchmark:validate -- --file "$BENCHMARK_REPORT"

      - name: Upload benchmark report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: context-atlas-benchmark-smoke
          path: ${{ runner.temp }}/context-atlas-benchmark-smoke.json
          if-no-files-found: error
          retention-days: 30
