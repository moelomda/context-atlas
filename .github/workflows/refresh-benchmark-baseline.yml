name: Refresh corrected benchmark baseline

on:
  push:
    branches: [perf/reproducible-benchmarks-clean]
    paths:
      - .github/workflows/refresh-benchmark-baseline.yml
      - .github/scripts/fix-benchmark-observed-counts.py

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'moelomda/context-atlas'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out benchmark branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/reproducible-benchmarks-clean
          fetch-depth: 0

      - name: Set up exact minimum Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.12.0"
          cache: npm

      - name: Install declared npm toolchain
        run: npm install --global npm@11.9.0 --ignore-scripts

      - name: Install locked dependencies
        run: npm ci

      - name: Correct observed-count extraction and schema validation
        run: |
          python .github/scripts/fix-benchmark-observed-counts.py
          npm run format

      - name: Run complete project gate
        run: npm run check

      - name: Commit corrected source and remove one-shot files
        shell: bash
        run: |
          rm .github/workflows/refresh-benchmark-baseline.yml .github/scripts/fix-benchmark-observed-counts.py docs/benchmarks/smoke-baseline.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "perf: validate Context Pack benchmark output counts"

      - name: Generate and validate corrected source-bound baseline
        run: |
          npm run benchmark:generate -- --scenario smoke --clean
          npm run benchmark -- --scenario smoke --samples 2 --output docs/benchmarks/smoke-baseline.json
          npm run benchmark:validate -- --file docs/benchmarks/smoke-baseline.json
          node - <<'NODE'
          const fs = require("node:fs");
          const { execFileSync } = require("node:child_process");
          const report = JSON.parse(fs.readFileSync("docs/benchmarks/smoke-baseline.json", "utf8"));
          const head = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (report.source.commit !== head || report.source.dirty !== false) {
            throw new Error(`Baseline source mismatch: report=${report.source.commit}/${report.source.dirty} head=${head}`);
          }
          if (report.observedCounts.contextPackSelected <= 0) {
            throw new Error("Corrected benchmark baseline contains no selected Context Pack items.");
          }
          NODE

      - name: Commit corrected baseline and push
        shell: bash
        run: |
          git add docs/benchmarks/smoke-baseline.json
          git diff --cached --check
          git commit -m "perf: refresh validated smoke benchmark baseline"
          git push origin HEAD:perf/reproducible-benchmarks-clean
