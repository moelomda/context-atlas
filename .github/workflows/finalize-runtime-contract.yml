name: Finalize runtime contract

on:
  push:
    branches: [fix/node-24-runtime-contract]
    paths:
      - package.json
      - .github/workflows/finalize-runtime-contract.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.repository == 'moelomda/context-atlas'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the runtime-contract branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/node-24-runtime-contract

      - name: Set up the exact minimum Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.12.0"
          cache: npm

      - name: Install the maintained npm toolchain
        run: npm install --global npm@11.9.0 --ignore-scripts

      - name: Regenerate lock metadata without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Synchronize public runtime documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "README.md",
              "This repository contains the source for a working experimental `0.1.0` alpha release candidate: a Node.js CLI, local web dashboard, TypeScript library, stdio MCP server, and Codex plugin bundle. The generated plugin runtime, local behavioral gates, latest local package candidate, and clean installed-package smoke described below have been verified on the current worktree. Hosted workflows and a GitHub release have not; `0.1.0` remains unpublished, and the broader production plan remains explicitly tracked in `docs/`.",
              "This repository contains the source for a working experimental `0.1.0` alpha release candidate: a Node.js CLI, local web dashboard, TypeScript library, stdio MCP server, and Codex plugin bundle. The generated plugin runtime, local behavioral gates, package candidate, clean installed-package smoke, hosted cross-platform CI, CodeQL, and dependency review have been verified. A GitHub release has not yet been published; `0.1.0` remains unpublished, and the broader production plan remains explicitly tracked in `ROADMAP.md` and `docs/`.",
          )
          replace_once(
              "README.md",
              "Requirements: Git and Node.js 24 or newer.",
              "Requirements: Git and Node.js `>=24.12.0 <25`. See [`docs/RUNTIME_SUPPORT.md`](docs/RUNTIME_SUPPORT.md) for the tested compatibility policy.",
          )
          replace_once(
              "CONTRIBUTING.md",
              "- Node.js 24 or newer",
              "- Node.js 24.12.0 or newer within the Node 24 release line",
          )
          replace_once(
              "CONTRIBUTING.md",
              "The implementation currently uses Node's built-in SQLite API, which Node 24\nlabels experimental. Warnings from that API are expected in this alpha; crashes,\ndata loss, or cross-platform differences are not.",
              "The implementation uses Node's built-in SQLite API, which the current Node 24\ndocumentation labels release candidate. Node 24.12.0 is the minimum because it\nadded the defensive constructor option used by Context Atlas. See\n[`docs/RUNTIME_SUPPORT.md`](docs/RUNTIME_SUPPORT.md) for the compatibility policy.\nCrashes, data loss, or cross-platform differences are not expected alpha behavior.",
          )
          replace_once(
              "docs/QUICK_START.md",
              "> **Alpha status:** Context Atlas has not published its first GitHub release yet. These instructions run the source checkout. Use a current Node.js 24 maintenance release; the exact minimum supported Node.js version is being qualified in [issue #4](https://github.com/moelomda/context-atlas/issues/4).",
              "> **Alpha status:** Context Atlas has not published its first GitHub release yet. These instructions run the source checkout. Use Node.js 24.12.0 or a newer maintenance release within Node 24; see [`RUNTIME_SUPPORT.md`](RUNTIME_SUPPORT.md).",
          )
          replace_once(
              "docs/QUICK_START.md",
              "- Node.js 24 or newer; and",
              "- Node.js 24.12.0 or newer within Node 24; and",
          )
          replace_once(
              "docs/QUICK_START.md",
              "Do not continue with Node.js 22 or older. Context Atlas uses Node's built-in SQLite API.",
              "Do not continue with Node.js earlier than 24.12.0 or an unqualified later major. Context Atlas currently qualifies the Node 24 line and uses its built-in SQLite API.",
          )
          replace_once(
              "CHANGELOG.md",
              "### Changed\n\n- Overview, graph, search, explain, assertion, API, MCP, pack, and dashboard",
              "### Changed\n\n- Runtime support is now explicitly Node.js `>=24.12.0 <25`, with an exact-floor CI job, installed-package smoke testing at the floor, and Node 24 type declarations.\n- Overview, graph, search, explain, assertion, API, MCP, pack, and dashboard",
          )
          PY

      - name: Commit generated lock and synchronized documentation
        shell: bash
        run: |
          rm .github/workflows/finalize-runtime-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json README.md CONTRIBUTING.md docs/QUICK_START.md CHANGELOG.md .github/workflows/finalize-runtime-contract.yml
          git commit -m "docs: synchronize the Node runtime contract"
          git push origin HEAD:fix/node-24-runtime-contract
