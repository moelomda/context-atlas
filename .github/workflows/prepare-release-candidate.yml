name: Prepare release-candidate documentation

on:
  push:
    branches: [release/v0.1.0-rc]
    paths:
      - .github/workflows/prepare-release-candidate.yml
      - .github/scripts/prepare-release-candidate.py

permissions:
  contents: write

jobs:
  prepare:
    if: github.repository == 'moelomda/context-atlas'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v0.1.0-rc

      - name: Set up exact minimum Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.12.0"
          cache: npm

      - name: Install declared npm toolchain
        run: npm install --global npm@11.9.0 --ignore-scripts

      - name: Install locked dependencies
        run: npm ci

      - name: Apply release-candidate documentation patch
        run: python .github/scripts/prepare-release-candidate.py

      - name: Run complete project gate
        run: npm run check

      - name: Commit verified documentation and remove one-shot files
        shell: bash
        run: |
          rm .github/scripts/prepare-release-candidate.py
          rm .github/workflows/prepare-release-candidate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md docs/IMPLEMENTATION_STATUS.md .github/scripts/prepare-release-candidate.py .github/workflows/prepare-release-candidate.yml
          git commit -m "docs: align the v0.1.0 release-candidate status"
          git push origin HEAD:release/v0.1.0-rc
