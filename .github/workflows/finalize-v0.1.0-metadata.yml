name: Finalize v0.1.0 release metadata

on:
  push:
    branches: [release/v0.1.0-rc]
    paths:
      - .github/workflows/finalize-v0.1.0-metadata.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.repository == 'moelomda/context-atlas'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v0.1.0-rc

      - name: Align publication date and tag-specific installation link
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one match in {path}, found {text.count(old)}: {old!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'CHANGELOG.md',
              '## [0.1.0] - 2026-08-17',
              '## [0.1.0] - 2026-08-28',
          )
          replace_once(
              '.github/RELEASE_NOTES_PREAMBLE.md',
              '[`docs/INSTALLING_RELEASE.md`](docs/INSTALLING_RELEASE.md)',
              '[`docs/INSTALLING_RELEASE.md`](https://github.com/moelomda/context-atlas/blob/v0.1.0/docs/INSTALLING_RELEASE.md)',
          )
          PY
          node .github/scripts/verify-release.mjs v0.1.0

      - name: Commit verified metadata and remove this one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/finalize-v0.1.0-metadata.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .github/RELEASE_NOTES_PREAMBLE.md .github/workflows/finalize-v0.1.0-metadata.yml
          git commit -m "release: finalize v0.1.0 publication metadata"
          git push origin HEAD:release/v0.1.0-rc
