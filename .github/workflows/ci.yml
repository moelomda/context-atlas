name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow lint / actionlint 1.7.12
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download and verify actionlint
        shell: pwsh
        run: |
          $archive = "actionlint_1.7.12_windows_amd64.zip"
          $expected = "6e7241b51e6817ea6a047693d8e6fed13b31819c9a0dd6c5a726e1592d22f6e9"
          Invoke-WebRequest -Uri "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$archive" -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "actionlint archive checksum mismatch: $actual" }
          Expand-Archive -LiteralPath $archive -DestinationPath actionlint
          & .\actionlint\actionlint.exe -color

  test:
    name: Test / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["24"]
        include:
          - os: ubuntu-latest
            node: "24.12.0"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install declared npm toolchain
        run: npm install --global npm@11.9.0 --ignore-scripts

      - name: Install locked dependencies
        run: npm ci

      - name: Build and test
        run: npm run check

  package:
    name: Package / install smoke test
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up minimum supported Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.12.0"
          cache: npm

      - name: Install declared npm toolchain
        run: npm install --global npm@11.9.0 --ignore-scripts

      - name: Install locked dependencies
        run: npm ci

      - name: Audit high-severity dependency findings
        run: npm audit --audit-level=high

      - name: Build distributable files
        run: npm run build

      - name: Verify committed plugin runtime is current
        run: git diff --exit-code -- plugin/context-atlas/runtime/server.mjs plugin/context-atlas/LICENSE plugin/context-atlas/THIRD_PARTY_NOTICES.md

      - name: Create package archive
        run: |
          mkdir package-artifacts
          npm pack --ignore-scripts --pack-destination package-artifacts --json > package-artifacts/npm-pack.json

      - name: Verify package boundary
        id: package
        run: node .github/scripts/verify-package.mjs package-artifacts/npm-pack.json

      - name: Smoke-test installed CLI, dashboard/API, and MCP plugin
        env:
          PACKAGE_FILE: ${{ steps.package.outputs.package_file }}
        run: |
          mkdir package-smoke
          cd package-smoke
          npm init --yes
          npm install --ignore-scripts "$PACKAGE_FILE"
          node ../.github/scripts/smoke-installed-package.mjs

      - name: Upload inspected package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: context-atlas-package
          path: |
            ${{ steps.package.outputs.package_file }}
            package-artifacts/npm-pack.json
          if-no-files-found: error
          retention-days: 14

  coverage:
    name: Source coverage gate
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install declared npm toolchain
        run: npm install --global npm@11.9.0 --ignore-scripts

      - name: Install locked dependencies
        run: npm ci

      - name: Build distributable files
        run: npm run build

      - name: Enforce TypeScript source coverage
        run: npm run test:coverage
