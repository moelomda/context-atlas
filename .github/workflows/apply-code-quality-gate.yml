name: Apply deterministic code-quality gates

on:
  push:
    branches: [chore/code-quality-gate]
    paths:
      - .github/workflows/apply-code-quality-gate.yml
      - .github/scripts/apply-code-quality-gate.py
      - .github/scripts/refine-code-quality-gate.py
      - .github/scripts/resolve-code-quality-diagnostics.py

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'moelomda/context-atlas'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/code-quality-gate

      - name: Set up exact minimum Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.12.0"
          cache: npm

      - name: Install declared npm toolchain
        run: npm install --global npm@11.9.0 --ignore-scripts

      - name: Install locked dependencies
        run: npm ci

      - name: Pin Biome and apply quality configuration
        shell: bash
        run: |
          npm install --save-dev --save-exact @biomejs/biome@2.5.10 --ignore-scripts
          python .github/scripts/apply-code-quality-gate.py
          python .github/scripts/refine-code-quality-gate.py
          python .github/scripts/resolve-code-quality-diagnostics.py

      - name: Apply reviewed lint fixes and canonical formatting
        run: |
          npx biome lint --write --unsafe --max-diagnostics=500 .
          npx biome format --write .

      - name: Run complete project gate
        run: npm run check

      - name: Audit and inspect package boundary
        run: |
          npm audit --audit-level=high
          npm pack --dry-run --ignore-scripts

      - name: Commit verified quality gate and remove one-shot files
        shell: bash
        run: |
          rm .github/workflows/apply-code-quality-gate.yml .github/scripts/apply-code-quality-gate.py .github/scripts/refine-code-quality-gate.py .github/scripts/resolve-code-quality-diagnostics.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: add deterministic lint and formatting gates"
          git push origin HEAD:chore/code-quality-gate
