name: Refresh hosted audit evidence

on:
  push:
    branches: [release/v0.1.0-rc]
    paths:
      - .github/workflows/refresh-hosted-audit.yml
      - .github/scripts/refresh-hosted-audit.py

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'moelomda/context-atlas'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v0.1.0-rc

      - name: Set up exact minimum Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.12.0"
          cache: npm

      - name: Install declared npm toolchain
        run: npm install --global npm@11.9.0 --ignore-scripts

      - name: Install locked dependencies
        run: npm ci

      - name: Refresh hosted audit evidence
        run: python .github/scripts/refresh-hosted-audit.py

      - name: Run complete project gate
        run: npm run check

      - name: Commit verified audit and remove one-shot files
        shell: bash
        run: |
          rm .github/scripts/refresh-hosted-audit.py
          rm .github/workflows/refresh-hosted-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/FULL_SCOPE_AUDIT.md .github/scripts/refresh-hosted-audit.py .github/workflows/refresh-hosted-audit.yml
          git commit -m "docs: refresh hosted release evidence"
          git push origin HEAD:release/v0.1.0-rc
