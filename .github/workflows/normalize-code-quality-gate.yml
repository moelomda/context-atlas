name: Normalize verified code-quality tree

on:
  push:
    branches: [chore/code-quality-gate-clean]
    paths:
      - .github/workflows/normalize-code-quality-gate.yml

permissions:
  contents: write

jobs:
  normalize:
    if: github.repository == 'moelomda/context-atlas'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out clean branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/code-quality-gate-clean
          fetch-depth: 0

      - name: Replace the working tree with the verified quality result
        shell: bash
        run: |
          git fetch origin chore/code-quality-gate --depth=1
          git read-tree --reset -u origin/chore/code-quality-gate
          test ! -e .github/workflows/apply-code-quality-gate.yml
          test ! -e .github/scripts/apply-code-quality-gate.py
          test ! -e .github/scripts/refine-code-quality-gate.py
          test ! -e .github/scripts/resolve-code-quality-diagnostics.py
          test ! -e .github/workflows/normalize-code-quality-gate.yml

      - name: Set up exact minimum Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.12.0"
          cache: npm

      - name: Install declared npm toolchain
        run: npm install --global npm@11.9.0 --ignore-scripts

      - name: Install locked dependencies
        run: npm ci

      - name: Run complete quality, build, and test gate
        run: npm run check

      - name: Audit and inspect package boundary
        run: |
          npm audit --audit-level=high
          npm pack --dry-run --ignore-scripts

      - name: Commit normalized verified tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: add deterministic lint and formatting gates"
          git push origin HEAD:chore/code-quality-gate-clean
