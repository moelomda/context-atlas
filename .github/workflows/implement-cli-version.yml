name: Implement CLI version command

on:
  push:
    branches: [feat/cli-version]
    paths:
      - .github/workflows/implement-cli-version.yml

permissions:
  contents: write

jobs:
  implement:
    if: github.repository == 'moelomda/context-atlas'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/cli-version

      - name: Set up exact minimum Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.12.0"
          cache: npm

      - name: Install declared npm toolchain
        run: npm install --global npm@11.9.0 --ignore-scripts

      - name: Install locked dependencies
        run: npm ci

      - name: Implement version command and tests
        run: python .github/scripts/implement-cli-version.py

      - name: Run full project gate
        run: npm run check

      - name: Verify repository-independent output directly
        shell: bash
        run: |
          test "$(node dist/cli.js version)" = "context-atlas 0.1.0"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          (
            cd "$tmp"
            node "$GITHUB_WORKSPACE/dist/cli.js" version --json > version.json
            node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync("version.json","utf8")); if(value.version!=="0.1.0"||value.supportedNodeRange!==">=24.12.0 <25") process.exit(1)'
            test ! -e .context-atlas
          )

      - name: Commit verified implementation and remove one-shot files
        shell: bash
        run: |
          rm .github/workflows/implement-cli-version.yml .github/scripts/implement-cli-version.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/version.ts src/cli.ts tests/cli.test.ts .github/scripts/smoke-installed-package.mjs README.md CHANGELOG.md .github/workflows/implement-cli-version.yml .github/scripts/implement-cli-version.py
          git commit -m "feat: add repository-independent CLI version diagnostics"
          git push origin HEAD:feat/cli-version
